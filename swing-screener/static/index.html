<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swing Screener</title>
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Swing Screener">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
:root{
  --bg:#0f1720; --card:#17212c; --card2:#1d2937; --line:#2a3848; --text:#e8eef5; --muted:#8fa1b5;
  --green:#2ecc71; --yellow:#f1c40f; --red:#e74c3c; --blue:#4da3ff; --accent:#4da3ff;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f6fa; --card:#ffffff; --card2:#eef2f7; --line:#d6dee8; --text:#132033; --muted:#5b6b7f;
         --green:#17a55a; --yellow:#b58900; --red:#d23b2e; --blue:#1769d1; --accent:#1769d1; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)) 16px;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.btn{background:var(--accent);color:#fff;padding:11px 16px;font-weight:600;min-height:44px;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--card2);color:var(--text);font-weight:500}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.green{background:var(--green)} .dot.yellow{background:var(--yellow)} .dot.red{background:var(--red)}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.tabs{display:flex;gap:8px;margin:12px 0 4px;overflow-x:auto}
.tab{background:var(--card2);color:var(--muted);padding:9px 14px;min-height:40px;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.card-h{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer}
.rank{font-weight:700;font-size:18px;min-width:24px;color:var(--muted)}
.grow{flex:1;min-width:0}
.name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted)}
.chip.ext{color:var(--green)} .chip.mix{color:var(--yellow)} .chip.co{color:var(--red)}
.etr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 12px}
.etr div{background:var(--card2);border-radius:10px;padding:7px 9px}
.etr b{display:block;font-size:11px;color:var(--muted);font-weight:500}
.etr span{font-weight:650}
.foot{display:flex;justify-content:space-between;padding:0 14px 12px;font-size:13px}
.more{display:none;padding:2px 14px 14px;border-top:1px solid var(--line);font-size:14px}
.card.open .more{display:block}
.more dl{margin:10px 0 0;display:grid;grid-template-columns:110px 1fr;gap:6px 10px}
.more dt{color:var(--muted)} .more dd{margin:0}
.pos{color:var(--green)} .neg{color:var(--red)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--card2);color:var(--muted);font-weight:600;white-space:nowrap}
td.nw{white-space:nowrap}
.login{max-width:360px;margin:18vh auto 0}
.login input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin:10px 0}
.err{color:var(--red);min-height:1.3em}
.hist{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.disc{margin-top:18px;font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="loginView" class="login" hidden>
  <h1>Swing Screener</h1>
  <p class="muted">Private app. Enter your password.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
  <div class="err" id="loginErr"></div>
  <button class="btn" id="loginBtn" style="width:100%">Log in</button>
</div>

<div id="appView" hidden>
  <header>
    <div>
      <h1>Swing Screener</h1>
      <div class="small muted" id="subtitle">Loading…</div>
    </div>
    <button class="btn" id="runBtn">Run now</button>
  </header>

  <div class="panel" id="statusPanel"></div>

  <div class="tabs">
    <button class="tab on" data-tab="cards">Quick view</button>
    <button class="tab" data-tab="table">Full table</button>
    <button class="tab" data-tab="history">History</button>
  </div>

  <div id="noteBox" class="panel" hidden></div>
  <div id="content"></div>

  <div class="disc">Research tool only. Not personal financial advice. Data comes from AI analysis of public web data and can be wrong or delayed. Verify prices and news before trading.</div>
  <p class="small muted"><a href="#" id="logout" style="color:var(--muted)">Log out</a></p>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { tab: "cards", latest: null, status: null, runs: [], viewing: null, open: new Set(), polling: null };

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opts });
  if (r.status === 401) { showLogin(); throw new Error("auth"); }
  if (!r.ok) {
    let msg = r.statusText; try { msg = (await r.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}

/* ---------- formatting ---------- */
const nf = (v, d = 2) => (v === null || v === undefined || v === "" || isNaN(v)) ? "–" : Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const px = (v) => (v === null || v === undefined || v === "" || isNaN(v)) ? "–" : Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
const pct = (v) => (v === null || v === undefined || isNaN(v)) ? "–" : `<span class="${v >= 0 ? "pos" : "neg"}">${v >= 0 ? "+" : ""}${nf(v, 1)}%</span>`;
const money = (v, cur) => (v === null || v === undefined || isNaN(v)) ? "–" : `${nf(v, v >= 1000 ? 0 : 2)}${cur ? " " + esc(cur) : ""}`;
const ratingLabel = { green: "Strong", yellow: "Watch", red: "Avoid" };
function clsChip(c) {
  c = String(c || "").toUpperCase();
  if (c === "EXTERNAL" || c === "MOSTLY EXTERNAL") return "ext";
  if (c === "MIXED") return "mix";
  return "co";
}
function when(iso) {
  if (!iso) return "–";
  return new Date(iso).toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 48) return h + " h ago";
  return Math.round(h / 24) + " d ago";
}
const trigLabel = { eu_open: "EU open", us_close: "US close", manual: "Manual" };

/* ---------- views ---------- */
function showLogin() { $("#appView").hidden = true; $("#loginView").hidden = false; stopPoll(); }
function showApp() { $("#loginView").hidden = true; $("#appView").hidden = false; }

function renderStatus() {
  const s = state.status; if (!s) return;
  const run = $("#runBtn");
  run.disabled = s.running;
  run.textContent = s.running ? "Running…" : "Run now";
  const l = state.latest;
  $("#subtitle").innerHTML = l && l.id
    ? `Last run: ${esc(when(l.finished_at))} · ${esc(trigLabel[l.trigger] || l.trigger)} · ${esc(ago(l.finished_at))}`
    : "No completed run yet";
  const next = (s.next_runs || []).map(n => `${esc(trigLabel[n.name] || n.name)}: ${esc(when(n.at))}`).join(" &nbsp;·&nbsp; ");
  const bits = [];
  if (s.running) {
    const secs = Math.max(0, Math.round(Date.now() / 1000 - s.current.started));
    bits.push(`<span class="pill"><span class="dot yellow pulse"></span>Running ${esc(trigLabel[s.current.trigger] || "")} screen · ${Math.floor(secs / 60)}m ${secs % 60}s (usually 3–10 min)</span>`);
  } else {
    bits.push(`<span class="pill"><span class="dot green"></span>Idle</span>`);
  }
  if (s.mock) bits.push(`<span class="pill">TEST MODE (sample data)</span>`);
  bits.push(`<span class="pill">Danelfin: ${s.danelfin ? "on" : "off"}</span>`);
  bits.push(`<span class="pill">Manual runs today: ${s.manual_runs_today}/${s.manual_runs_limit}</span>`);
  $("#statusPanel").innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:8px">${bits.join("")}</div>` +
    (next ? `<div class="small muted" style="margin-top:8px">Next: ${next}</div>` : `<div class="small muted" style="margin-top:8px">Scheduling is off.</div>`);
}

function currentData() {
  if (state.viewing) return state.viewing;
  return state.latest && state.latest.id ? state.latest : null;
}

function renderNote(d) {
  const box = $("#noteBox");
  const note = d && d.result && d.result.market_note;
  if (state.tab !== "history" && note) { box.hidden = false; box.innerHTML = `<b>Market note</b><div class="muted" style="margin-top:4px">${esc(note)}</div>`; }
  else box.hidden = true;
}

function cardHtml(s, i) {
  const open = state.open.has(i) ? " open" : "";
  const ai = s.danelfin_ai_score !== null && s.danelfin_ai_score !== undefined ? `Danelfin ${esc(s.danelfin_ai_score)}/10` : "";
  const rr = s.risk_reward;
  return `
  <div class="card${open}" data-i="${i}">
    <div class="card-h">
      <div class="rank">${esc(s.rank)}</div>
      <div class="grow">
        <div class="name"><span class="dot ${esc(s.rating)}"></span> ${esc(s.company)}</div>
        <div class="small muted">${esc(s.ticker)} · ${esc(s.country)} · ${esc(ratingLabel[s.rating] || "")}</div>
        <div class="chips">
          <span class="chip ${clsChip(s.classification)}">${esc(s.classification)}</span>
          <span class="chip">${esc(s.timing)}</span>
          ${s.theme ? `<span class="chip">${esc(s.theme)}</span>` : ""}
          ${ai ? `<span class="chip">${ai}</span>` : ""}
        </div>
      </div>
      <div class="right">
        <div><b>${money(s.price, s.currency)}</b></div>
        <div class="small">${pct(s.today_pct)} today</div>
        <div class="small muted">${nf(s.discount_from_52w_high_pct, 0)}% vs 52w high</div>
      </div>
    </div>
    <div class="etr">
      <div><b>Entry</b><span>${px(s.entry_low)}–${px(s.entry_high)}</span></div>
      <div><b>Stop</b><span class="neg">${px(s.stop)}</span></div>
      <div><b>Target</b><span class="pos">${px(s.target)}</span></div>
    </div>
    <div class="foot">
      <span>Up ${pct(s.upside_pct)} · Down <span class="neg">-${nf(s.downside_pct, 1)}%</span></span>
      <span><b>R/R ${rr ? nf(rr, 1) + ":1" : "–"}</b> · Conf ${esc(s.confidence)}/10</span>
    </div>
    <div class="more">
      <dl>
        <dt>Why down</dt><dd>${esc(s.why_down)}</dd>
        <dt>Could improve</dt><dd>${esc(s.what_could_improve)}</dd>
        <dt>Reversal</dt><dd>${esc(s.reversal_evidence)}</dd>
        <dt>Catalyst</dt><dd>${esc(s.catalyst)}${s.catalyst_date ? " (" + esc(s.catalyst_date) + ")" : ""}</dd>
        <dt>Performance</dt><dd>Week ${pct(s.week_pct)} · 1M ${pct(s.month_pct)}</dd>
        <dt>Technicals</dt><dd>RSI ${nf(s.rsi, 0)} · 50DMA ${s.above_50dma ? "above" : "below"} · 200DMA ${s.above_200dma ? "above" : "below"}</dd>
        <dt>Scores</dt><dd>Fundamental ${esc(s.fundamental_score)}/10 · Technical ${esc(s.technical_score)}/10</dd>
        ${s.danelfin_note ? `<dt>Danelfin</dt><dd>${esc(s.danelfin_note)}</dd>` : ""}
        <dt>Main risk</dt><dd>${esc(s.risks)}</dd>
        <dt>Scalable</dt><dd>${esc(s.scalable)}</dd>
      </dl>
    </div>
  </div>`;
}

function tableHtml(stocks) {
  const cols = [
    ["#", s => esc(s.rank)], ["Rating", s => `<span class="dot ${esc(s.rating)}"></span> ${esc(ratingLabel[s.rating] || "")}`],
    ["Company", s => esc(s.company)], ["Country", s => esc(s.country)], ["Ticker", s => esc(s.ticker)],
    ["Price", s => money(s.price, s.currency)], ["Today", s => pct(s.today_pct)], ["Week", s => pct(s.week_pct)], ["1M", s => pct(s.month_pct)],
    ["vs 52W high", s => nf(s.discount_from_52w_high_pct, 0) + "%"],
    ["Why down", s => esc(s.why_down)], ["Type", s => esc(s.classification)], ["Could improve", s => esc(s.what_could_improve)],
    ["Timing", s => esc(s.timing)], ["Fund /10", s => esc(s.fundamental_score)], ["Tech /10", s => esc(s.technical_score)],
    ["Danelfin", s => esc(s.danelfin_ai_score ?? "–")], ["Reversal", s => esc(s.reversal_evidence)],
    ["Catalyst", s => esc(s.catalyst) + (s.catalyst_date ? " (" + esc(s.catalyst_date) + ")" : "")],
    ["Entry zone", s => `${px(s.entry_low)}–${px(s.entry_high)}`], ["Stop", s => px(s.stop)], ["Target", s => px(s.target)],
    ["Up %", s => pct(s.upside_pct)], ["Down %", s => `-${nf(s.downside_pct, 1)}%`], ["R/R", s => s.risk_reward ? nf(s.risk_reward, 1) + ":1" : "–"],
    ["Scalable", s => esc(s.scalable)], ["Conf", s => esc(s.confidence) + "/10"],
  ];
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>` +
    stocks.map(s => `<tr>${cols.map(c => `<td class="${c[0] === "Company" || c[0] === "Price" ? "nw" : ""}">${c[1](s)}</td>`).join("")}</tr>`).join("") +
    `</tbody></table></div>`;
}

function renderContent() {
  const el = $("#content");
  if (state.tab === "history") { renderHistory(el); renderNote(null); return; }
  const d = currentData();
  renderNote(d);
  if (!d) { el.innerHTML = `<div class="empty">No results yet.<br>Tap <b>Run now</b> or wait for the next scheduled run.</div>`; return; }
  const stocks = (d.result && d.result.stocks) || [];
  const banner = state.viewing ? `<div class="panel small">Viewing an older run from ${esc(when(d.finished_at))}. <a href="#" id="backLatest">Back to latest</a></div>` : "";
  if (!stocks.length) { el.innerHTML = banner + `<div class="empty">This run found no qualifying setups.</div>`; bindBack(); return; }
  el.innerHTML = banner + (state.tab === "table" ? tableHtml(stocks) : stocks.map(cardHtml).join(""));
  bindBack();
  el.querySelectorAll(".card-h").forEach(h => h.addEventListener("click", () => {
    const card = h.parentElement, i = Number(card.dataset.i);
    card.classList.toggle("open"); card.classList.contains("open") ? state.open.add(i) : state.open.delete(i);
  }));
}
function bindBack() { const b = $("#backLatest"); if (b) b.addEventListener("click", e => { e.preventDefault(); state.viewing = null; renderContent(); }); }

function renderHistory(el) {
  if (!state.runs.length) { el.innerHTML = `<div class="empty">No runs yet.</div>`; return; }
  el.innerHTML = state.runs.map(r => {
    const st = r.status === "done" ? `<span class="dot green"></span> ${r.count} stocks` :
      r.status === "running" ? `<span class="dot yellow pulse"></span> running` : `<span class="dot red"></span> failed`;
    return `<div class="card"><div class="hist" data-id="${r.id}" data-status="${esc(r.status)}">
      <div><b>${esc(trigLabel[r.trigger] || r.trigger)}</b><div class="small muted">${esc(when(r.started_at))}</div>
      ${r.error ? `<div class="small neg">${esc(r.error)}</div>` : ""}</div><div>${st}</div></div></div>`;
  }).join("");
  el.querySelectorAll(".hist").forEach(h => h.addEventListener("click", async () => {
    if (h.dataset.status !== "done") return;
    state.viewing = await api("/api/runs/" + h.dataset.id); state.tab = "cards"; setTabs(); renderContent(); window.scrollTo(0, 0);
  }));
}

function setTabs() { document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === state.tab)); }

/* ---------- loading & polling ---------- */
async function refresh() {
  const [status, latest, runs] = await Promise.all([api("/api/status"), api("/api/latest"), api("/api/runs")]);
  const wasRunning = state.status && state.status.running;
  state.status = status; state.latest = latest; state.runs = runs;
  renderStatus(); renderContent();
  if (status.running) startPoll(); else stopPoll();
  if (wasRunning && !status.running) { state.viewing = null; }
}
function startPoll() { if (!state.polling) state.polling = setInterval(() => refresh().catch(() => {}), 5000); }
function stopPoll() { if (state.polling) { clearInterval(state.polling); state.polling = null; } }

$("#runBtn").addEventListener("click", async () => {
  $("#runBtn").disabled = true;
  try { await api("/api/run", { method: "POST" }); } catch (e) { if (e.message !== "auth") alert(e.message); }
  refresh().catch(() => {});
});
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { state.tab = t.dataset.tab; setTabs(); renderContent(); }));
$("#logout").addEventListener("click", async (e) => { e.preventDefault(); await fetch("/api/logout", { method: "POST" }); showLogin(); });

async function doLogin() {
  $("#loginErr").textContent = "";
  try {
    await api("/api/login", { method: "POST", body: JSON.stringify({ password: $("#pw").value }) });
    $("#pw").value = ""; showApp(); await refresh();
  } catch (e) { if (e.message !== "auth") $("#loginErr").textContent = e.message; }
}
$("#loginBtn").addEventListener("click", doLogin);
$("#pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#appView").hidden) refresh().catch(() => {}); });

(async () => {
  try { await api("/api/me"); showApp(); await refresh(); } catch (e) { showLogin(); }
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
