# Render "Blueprint": tells Render exactly how to run the app.
# One always-on web service + a small persistent disk for the run history.
services:
  - type: web
    name: swing-screener
    runtime: python
    plan: starter            # always-on plan is needed for scheduled runs (free plans go to sleep)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    disk:
      name: screener-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false            # you type these in the Render dashboard, never in the code
      - key: DANELFIN_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: MODEL
        value: claude-sonnet-5
      - key: MOCK_MODE
        value: "false"
